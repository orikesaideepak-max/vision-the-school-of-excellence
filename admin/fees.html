<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vision School ERP - Fee Management</title>

<link rel="stylesheet" href="fee_management.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

<h1>
🏫 Vision School ERP
</h1>

<p>
Student Fee Management
</p>


</header>



<div class="container">



<!-- ================= DASHBOARD ================= -->


<section class="dashboard">


<div class="card">
<h3>Total Students</h3>
<h2 id="totalStudents">
0
</h2>
</div>


<div class="card">
<h3>Total Collection</h3>
<h2 id="totalCollection">
₹0
</h2>
</div>


<div class="card">
<h3>Total Pending</h3>
<h2 id="totalPending">
₹0
</h2>
</div>


<div class="card">
<h3>Total Fee</h3>
<h2 id="totalFee">
₹0
</h2>
</div>


</section>






<!-- ================= SEARCH ================= -->


<section class="search-section">


<input 
type="text"
id="searchName"
placeholder="Search Student Name / Mobile"
>


<input 
type="text"
id="searchClass"
placeholder="Search Class"
>


<button onclick="applySearch()">
🔍 Search
</button>


<button onclick="loadFeeData()">
🔄 Refresh
</button>


</section>







<!-- ================= TABLE ================= -->


<section class="table-container">


<table>


<thead>


<tr>

<th>
Student
</th>


<th>
Mobile
</th>


<th>
Class
</th>


<th>
Total Fee
</th>


<th>
Paid
</th>


<th>
Pending
</th>


<th>
Update Fee
</th>


<th>
Payment
</th>


<th>
Contact
</th>


<th>
History
</th>


</tr>


</thead>



<tbody id="feeTable">


</tbody>



</table>


</section>







<!-- ================= CHART ================= -->


<section class="chart-section">


<h2>
📊 Fee Analytics
</h2>


<canvas id="feeChart">

</canvas>


</section>





</div>







<!-- ================= PAYMENT MODAL ================= -->


<div id="paymentModal" class="modal">


<div class="modal-box">


<h2>
💰 Add Payment
</h2>



<input 
type="hidden"
id="paymentStudentId"
>



<label>
Student Name
</label>

<input 
id="paymentStudentName"
readonly
>



<label>
Amount Paid
</label>


<input 
type="number"
id="paymentAmount"
placeholder="Enter Amount"
>



<label>
Receipt Number
</label>


<input 
id="receiptNumber"
placeholder="Receipt No"
>




<button onclick="savePayment()">
Save Payment
</button>



<button onclick="closePaymentModal()">
Cancel
</button>



</div>


</div>








<!-- ================= HISTORY MODAL ================= -->


<div id="historyModal" class="modal">


<div class="modal-box history-box">


<h2>
📜 Payment History
</h2>


<div id="historyContent">

</div>



<button onclick="closeHistoryModal()">

Close

</button>


</div>


</div>






<script type="module" src="fee_management.js"></script>



</body>

</html>
