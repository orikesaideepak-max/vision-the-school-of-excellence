<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vision School – Teachers Master</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================
VISION SCHOOL ERP
TEACHERS MASTER
Premium UI
===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

:root{

--primary:#1565c0;
--primary-dark:#0d47a1;
--primary-light:#42a5f5;

--success:#2e7d32;
--danger:#e53935;

--bg:#f5f7fb;
--card:#ffffff;
--text:#263238;
--text-light:#607d8b;

--border:#e3e8ef;

--shadow:0 10px 25px rgba(0,0,0,.08);

--radius:18px;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Poppins,sans-serif;
background:var(--bg);
color:var(--text);

}

/* =====================================
HEADER
===================================== */

header{

background:linear-gradient(135deg,#1565c0,#42a5f5);

color:#fff;

padding:22px;

font-size:28px;

font-weight:700;

letter-spacing:.5px;

text-align:center;

box-shadow:0 8px 25px rgba(21,101,192,.25);

}

/* =====================================
CONTAINER
===================================== */

.container{

padding:35px;

max-width:1500px;

margin:auto;

}

/* =====================================
COUNT BOX
===================================== */

.count-box{

background:white;

padding:18px 22px;

border-radius:16px;

font-size:18px;

font-weight:600;

box-shadow:var(--shadow);

margin-bottom:25px;

display:inline-block;

}

.count-box span{

color:var(--primary);

font-size:26px;

font-weight:700;

}

/* =====================================
TOP BAR
===================================== */

.top-bar{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

margin-bottom:25px;

flex-wrap:wrap;

}

/* =====================================
SEARCH
===================================== */

.search-bar{

display:flex;

gap:15px;

flex-wrap:wrap;

}

.search-bar input{

width:250px;

padding:13px 16px;

border:1px solid var(--border);

border-radius:12px;

font-size:14px;

transition:.3s;

background:white;

}

.search-bar input:focus{

outline:none;

border-color:var(--primary);

box-shadow:0 0 0 3px rgba(21,101,192,.15);

}

/* =====================================
BUTTONS
===================================== */

button{

border:none;

cursor:pointer;

padding:12px 22px;

font-size:14px;

font-weight:600;

border-radius:12px;

transition:.3s;

font-family:Poppins;

}

button:hover{

transform:translateY(-3px);

}

.edit{

background:#ff9800;

color:white;

}

.edit:hover{

background:#fb8c00;

}

.view{

background:#1565c0;

color:white;

}

.view:hover{

background:#0d47a1;

}

.export{

background:#2e7d32;

color:white;

}

.export:hover{

background:#1b5e20;

}

/* =====================================
TABLE
===================================== */

.table-wrapper{

background:white;

border-radius:20px;

overflow:auto;

box-shadow:var(--shadow);

}

table{

width:100%;

border-collapse:collapse;

min-width:1000px;

}

thead{

background:linear-gradient(135deg,#1565c0,#1976d2);

}

th{

padding:18px;

color:white;

font-size:14px;

font-weight:600;

text-align:left;

white-space:nowrap;

}

td{

padding:16px;

font-size:14px;

border-bottom:1px solid #eef2f7;

}

tbody tr{

transition:.25s;

}

tbody tr:hover{

background:#f8fbff;

}

/* =====================================
PHOTO
===================================== */

table img{

width:50px;

height:50px;

border-radius:50%;

object-fit:cover;

border:3px solid var(--primary);

}

/* =====================================
STATUS
===================================== */

.status-active{

background:#e8f5e9;

color:#2e7d32;

padding:6px 14px;

border-radius:30px;

font-weight:600;

display:inline-block;

}

.status-inactive{

background:#ffebee;

color:#d32f2f;

padding:6px 14px;

border-radius:30px;

font-weight:600;

display:inline-block;

}

/* =====================================
MODAL
===================================== */

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

justify-content:center;

align-items:center;

padding:20px;

z-index:1000;

}

.modal-box{

background:white;

width:100%;

max-width:650px;

border-radius:20px;

box-shadow:0 25px 60px rgba(0,0,0,.25);

overflow:hidden;

animation:popup .3s ease;

}

@keyframes popup{

from{

transform:scale(.9);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

.modal-box h3{

padding:20px;

background:linear-gradient(135deg,#1565c0,#42a5f5);

color:white;

font-size:22px;

}

.modal-box{

padding-bottom:25px;

}

.preview{

width:110px;

height:110px;

border-radius:50%;

display:block;

margin:25px auto;

border:4px solid var(--primary);

object-fit:cover;

}

.field{

width:90%;

display:block;

margin:12px auto;

padding:13px 15px;

border:1px solid var(--border);

border-radius:12px;

font-size:14px;

transition:.3s;

}

.field:focus{

outline:none;

border-color:var(--primary);

box-shadow:0 0 0 3px rgba(21,101,192,.15);

}

.modal-actions{

display:flex;

justify-content:flex-end;

gap:15px;

padding:0 30px;

margin-top:20px;

}

/* =====================================
SCROLLBAR
===================================== */

::-webkit-scrollbar{

width:10px;

height:10px;

}

::-webkit-scrollbar-thumb{

background:#1565c0;

border-radius:20px;

}

::-webkit-scrollbar-track{

background:#edf2f7;

}

/* =====================================
RESPONSIVE
===================================== */

@media(max-width:992px){

.container{

padding:20px;

}

.top-bar{

flex-direction:column;

align-items:stretch;

}

.search-bar{

width:100%;

}

.search-bar input{

width:100%;

}

button{

width:100%;

}

.modal-actions{

flex-direction:column;

}

.modal-actions button{

width:100%;

}

}

@media(max-width:768px){

header{

font-size:22px;

padding:18px;

}

.count-box{

display:block;

text-align:center;

}

table{

min-width:800px;

}

.preview{

width:90px;

height:90px;

}

.modal-box{

max-width:100%;

}

}

@media(max-width:480px){

.container{

padding:12px;

}

header{

font-size:20px;

}

.count-box{

font-size:15px;

}

.count-box span{

font-size:22px;

}

.search-bar input{

font-size:13px;

padding:12px;

}

button{

font-size:13px;

padding:11px;

}

th,td{

padding:12px;

font-size:13px;

}

}
</style>
</head>
<body>

<header>🏫 Vision School – Teachers Master</header>

<div class="container">

<div class="count-box">Total Teachers: <span id="teacher-count">0</span></div>

<div class="top-bar">
  <div class="search-bar">
    <input id="searchName" placeholder="Search Name">
    <input id="searchEmail" placeholder="Search Email">
  </div>
  <button class="export" onclick="exportTeachers()">Export Teachers</button>
</div>

<div class="table-wrapper">
<table>
  <thead>
    <tr>
      <th>Photo</th>
      <th>Name</th>
      <th>Email</th>
      <th>Mobile</th>
      <th>Subject</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="teachersBody"></tbody>
</table>
</div>

</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <h3>Edit Teacher</h3>
    <input type="hidden" id="teacherId">
    <img id="photoPreview" class="preview">
    <input id="photo_url" class="field" placeholder="Photo URL">
    <input id="name" class="field" placeholder="Name">
    <input id="email" class="field" placeholder="Email">
    <input id="mobile" class="field" placeholder="Mobile">
    <input id="subject" class="field" placeholder="Subject">
    <select id="status" class="field">
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
    <div class="modal-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="edit" onclick="saveTeacher()">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://gocoupvzzsgouwdkdmzu.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvY291cHZ6enNnb3V3ZGtkbXp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwMDc2MTAsImV4cCI6MjA4NTU4MzYxMH0.XGxBzWLg9etqOo9NVAX5mrli2u-0dwEYGsVgwx4tXaw"
)

const teachersBody = document.getElementById("teachersBody")
let teachersCache = []

// Fetch teachers like your users logic
async function fetchTeachers(){
  const { data:users, error } = await supabase
    .from("profiles")
    .select("user_id,full_name,email,role,teachers(*)") // optional join if you store teacher details separately
    .eq("role","teacher")

  if(error){
    alert(error.message)
    return
  }

  teachersCache = users || []
  document.getElementById("teacher-count").innerText = teachersCache.length
  renderTable(teachersCache)
}

function renderTable(data){
  teachersBody.innerHTML = ""
  data.forEach(u=>{
    const t = u.teachers?.[0] || {}
    const statusClass = t.status==="inactive"?"status-inactive":"status-active"
    const statusText = t.status==="inactive"?"Inactive":"Active"

    teachersBody.innerHTML += `
      <tr>
        <td><img src="${t.photo_url||'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" width="35" style="border-radius:50%"></td>
        <td>${u.full_name}</td>
        <td>${u.email}</td>
        <td>${t.mobile||"-"}</td>
        <td>${t.subject||"-"}</td>
        <td><span class="${statusClass}">${statusText}</span></td>
        <td>
          <button class="edit" onclick="editTeacher('${u.user_id}')">Edit</button>
          <button class="view" onclick="viewTeacher('${u.user_id}')">View</button>
        </td>
      </tr>
    `
  })
}

// Modal functions
window.editTeacher = async(id)=>{
  document.getElementById("editModal").style.display="block"
  const {data,error} = await supabase.from("teachers").select("*").eq("user_id",id).single()
  if(error){alert(error.message); return;}
  document.getElementById("teacherId").value = id
  document.getElementById("name").value = data.name || ""
  document.getElementById("email").value = data.email || ""
  document.getElementById("mobile").value = data.mobile || ""
  document.getElementById("subject").value = data.subject || ""
  document.getElementById("status").value = data.status || "active"
  document.getElementById("photo_url").value = data.photo_url || ""
  document.getElementById("photoPreview").src = data.photo_url || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
}

window.saveTeacher = async ()=>{
  const id = document.getElementById("teacherId").value
  await supabase.from("teachers").update({
    name:document.getElementById("name").value,
    email:document.getElementById("email").value,
    mobile:document.getElementById("mobile").value,
    subject:document.getElementById("subject").value,
    status:document.getElementById("status").value,
    photo_url:document.getElementById("photo_url").value
  }).eq("user_id",id)
  closeModal()
  fetchTeachers()
}

window.closeModal = ()=>{document.getElementById("editModal").style.display="none"}

window.exportTeachers = ()=>{
  let csv="Name,Email,Mobile,Subject,Status\n"
  teachersCache.forEach(u=>{
    const t = u.teachers?.[0] || {}
    csv+=`${u.full_name},${u.email},${t.mobile||""},${t.subject||""},${t.status||"active"}\n`
  })
  const blob = new Blob([csv])
  const link = document.createElement("a")
  link.href = URL.createObjectURL(blob)
  link.download = "teachers.csv"
  link.click()
}

window.viewTeacher = (id)=>{
  window.location.href = "teachers.html?id=" + id
}

// Optional search
document.getElementById("searchName").addEventListener("input",()=>{
  const q = document.getElementById("searchName").value.toLowerCase()
  renderTable(teachersCache.filter(u=>u.full_name.toLowerCase().includes(q)))
})
document.getElementById("searchEmail").addEventListener("input",()=>{
  const q = document.getElementById("searchEmail").value.toLowerCase()
  renderTable(teachersCache.filter(u=>u.email.toLowerCase().includes(q)))
})

fetchTeachers()
</script>
</body>
</html>
