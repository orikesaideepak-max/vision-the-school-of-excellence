<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Fees - Vision School ERP</title>

<link rel="stylesheet" href="pending_fees.css">
```

</head>

<body>

```
<!-- HEADER -->

<header class="header">

    <div>
        <h1>🏫 Vision School ERP</h1>
        <p>Students With Pending Fees</p>
    </div>

</header>


<div class="container">


    <!-- PAGE TOP -->

    <section class="page-top">

        <div>

            <h2>💰 Pending Fee Students</h2>

            <p id="pendingCount">
                0 students
            </p>

        </div>


        <div class="top-buttons">

            <button class="back-btn" onclick="goBack()">
                ← Back
            </button>

            <button class="export-btn" onclick="exportPendingStudents()">
                📥 Export
            </button>

        </div>

    </section>



    <!-- SEARCH SECTION -->

    <section class="search-section">

        <div class="search-box">

            <label>
                Student / Mobile
            </label>

            <input
                type="text"
                id="searchStudent"
                placeholder="Search Student Name / Mobile"
                oninput="filterStudents()"
            >

        </div>


        <div class="search-box">

            <label>
                Class
            </label>

            <input
                type="text"
                id="searchClass"
                placeholder="Search Class"
                oninput="filterStudents()"
            >

        </div>


        <button class="clear-btn" onclick="clearSearch()">
            🔄 Clear
        </button>

    </section>



    <!-- TABLE -->

    <section class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Student</th>

                    <th>Mobile</th>

                    <th>Class</th>

                    <th>Total Fee</th>

                    <th>Paid</th>

                    <th>Pending</th>

                </tr>

            </thead>


            <tbody id="pendingTable">

            </tbody>

        </table>

    </section>


</div>


<script type="module" src="pending_fees.js"></script>
```

</body>

</html>
