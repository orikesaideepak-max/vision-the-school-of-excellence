<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hall Tickets - Vision School ERP</title>

    <link
        rel="stylesheet"
        href="hall_tickets.css"
    >

</head>


<body>


    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <header class="page-header">

        <div>

            <h1>
                🎫 Hall Tickets
            </h1>

            <p>
                Vision School ERP
            </p>

        </div>


        <button
            class="back-button"
            onclick="goBackToFees()"
        >
            ← Back
        </button>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main-container">


        <!-- =================================================
             STATISTICS
        ================================================== -->

        <section class="statistics">


            <!-- TOTAL -->

            <div class="stat-card">

                <div class="stat-title">
                    Total Students
                </div>

                <div
                    class="stat-number"
                    id="totalStudents"
                >
                    0
                </div>

            </div>



            <!-- CLEARED -->

            <div class="stat-card cleared">

                <div class="stat-title">
                    Cleared Students
                </div>

                <div
                    class="stat-number"
                    id="clearedStudents"
                >
                    0
                </div>

                <div
                    class="stat-percent"
                    id="clearedPercentage"
                >
                    0%
                </div>

            </div>



            <!-- PENDING -->

            <div class="stat-card pending">

                <div class="stat-title">
                    Pending Students
                </div>

                <div
                    class="stat-number"
                    id="pendingStudents"
                >
                    0
                </div>

                <div
                    class="stat-percent"
                    id="pendingPercentage"
                >
                    0%
                </div>

            </div>


        </section>



        <!-- =================================================
             TERM SELECTION
        ================================================== -->

        <section class="term-section">

            <h2>
                Select Fee Term
            </h2>


            <div class="term-buttons">


                <button
                    id="termButton1"
                    class="term-button active"
                    onclick="selectTerm(1)"
                >
                    1st Term
                </button>


                <button
                    id="termButton2"
                    class="term-button"
                    onclick="selectTerm(2)"
                >
                    2nd Term
                </button>


                <button
                    id="termButton3"
                    class="term-button"
                    onclick="selectTerm(3)"
                >
                    3rd Term
                </button>


            </div>

        </section>



        <!-- =================================================
             EXAM SELECTION
        ================================================== -->

        <section class="exam-section">

            <div class="exam-heading">

                <h2>
                    Select Exam
                </h2>

                <span id="examHelp">
                    Select an exam to enable hall-ticket downloads.
                </span>

            </div>


            <div
                id="examButtons"
                class="exam-buttons"
            >

            </div>

        </section>



        <!-- =================================================
             SEARCH
        ================================================== -->

        <section class="search-section">


            <input
                id="searchInput"
                type="text"
                placeholder="Search student name or mobile"
                oninput="filterHallTickets()"
            >


            <input
                id="classInput"
                type="text"
                placeholder="Search class"
                oninput="filterHallTickets()"
            >


            <button
                class="clear-button"
                onclick="clearSearch()"
            >
                Clear
            </button>


        </section>



        <!-- =================================================
             INFORMATION BAR
        ================================================== -->

        <section class="info-bar">


            <div>

                <strong id="selectedTermText">
                    1st Term
                </strong>

                <span>
                    — Fee status
                </span>

            </div>


            <div>

                Exam:

                <strong id="selectedExamText">
                    Not Selected
                </strong>

            </div>


            <div>

                Students:

                <strong id="eligibleCount">
                    0
                </strong>

            </div>


            <button
                id="downloadAllButton"
                class="download-all-button"
                onclick="downloadAllHallTickets()"
                disabled
            >
                📥 Download All Hall Tickets
            </button>


        </section>



        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="loadingMessage"
            class="message"
        >
            Loading students...
        </div>



        <!-- =================================================
             EMPTY
        ================================================== -->

        <div
            id="emptyMessage"
            class="message"
            style="display: none;"
        >
            No students found.
        </div>



        <!-- =================================================
             STUDENT LIST
        ================================================== -->

        <section
            id="studentsContainer"
            class="students-container"
        >
        </section>


    </main>



    <!-- =====================================================
         HIDDEN PDF AREA
    ====================================================== -->

    <div
        id="pdfHallTicketContainer"
        class="pdf-hall-ticket-container"
    >
    </div>



    <!-- =====================================================
         HTML2CANVAS
    ====================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    ></script>



    <!-- =====================================================
         JSPDF
    ====================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    ></script>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="hall_tickets.js"
    ></script>


</body>

</html>
